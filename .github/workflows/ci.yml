name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest --cov=agentic_gtm --cov-report=term-missing
      - run: uv run python scripts/validate_release.py
      - run: uv run python scripts/scan_public_release.py . --history
