[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gtmadviser-agentic-gtm"
version = "0.1.0"
description = "Deterministic CLI and portable Agent Skills for startup GTM operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GTM Adviser", email = "hello@gtmadviser.com" }]
keywords = ["gtm", "sales", "agent-skills", "codex", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
gtm = "agentic_gtm.cli.app:main"

[project.urls]
Homepage = "https://gtmadviser.com/agentic-gtm"
Repository = "https://github.com/gtmadviser/agentic-gtm"
Issues = "https://github.com/gtmadviser/agentic-gtm/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_gtm"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]
